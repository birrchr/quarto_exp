[project]
name = "health-survey-portal"
version = "0.1.0"
description = "A Quarto-based survey data portal using pre-aggregated outputs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "faker>=24.0.0",
    "plotly>=5.22.0",
    "pyarrow>=15.0.0",
    "pingouin>=0.5.4",
    "itables>=2.1.0",
    "great-tables>=0.9.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "polars>=0.20.0",
    "ipykernel>=7.3.0",
    "pyyaml>=6.0.3",
    "jupyter-cache>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]
